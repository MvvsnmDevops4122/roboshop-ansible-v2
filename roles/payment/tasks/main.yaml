- name: Run another role - application setup 
  ansible.builtin.include_role:
    name: common
    tasks_from: app-setup

- name: Run another role - python setup 
  ansible.builtin.include_role:
    name: common
    tasks_from: python

- name: Run another role - systemd setup 
  ansible.builtin.include_role:
    name: common
    tasks_from: systemd-setup
    

- name: Run another role - start and enable
  ansible.builtin.include_role:
    name: common
    tasks_from: restart
